services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: sequencer-log-platform-api
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./.env:/app/.env
      - ./.env.example:/app/.env.example:ro
      - ./data:/app/data
      - ./config:/app/config
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    container_name: sequencer-log-platform-web
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
