time_formats:
  - "%Y/%m/%d %H:%M:%S.%f"
  - "%Y/%m/%d %H:%M:%S:%f"
  - "%Y-%m-%d %H:%M:%S.%f"

cycle_patterns:
  - "\\bCycle\\s*(\\d+)\\b"
  - "\\bcycle(\\d+)\\b"
  - "\\bS(\\d{3,4})\\b"
  - "\\bC(\\d{1,4})\\b"

chip_patterns:
  - "\\b(HLAB\\d{4,})\\b"
  - "\\bchip[_ -]?name[:= ]+([A-Za-z0-9_.-]+)"
  - "\\bslide[:= ]+([A-Za-z0-9_.-]+)"
  - "\\b(B\\d{1,3}|A\\d{1,3})\\b"

component_filename_rules:
  OpticalBoard: "OpticalBoard"
  RobotScheduler: "RobotScheduler"
  RunError: "RunErrorService"
  Scanner_1: "Scanner_1"
  Scanner_2: "Scanner_2"
  ScriptRunner: "ScriptRunner"
  StageRunMgr: "StageRunMgr"
  T100Scheduler: "T100Scheduler"
  XYZStage: "XYZStage"
  ErrorLogs: "GlobalErrorLog"
  ImagingMetrics: "ImagingMetrics"
  FOVMetrics: "FOVMetrics"
  workflow: "Workflow"

pairing_rules:
  - start_keywords: ["start", "begin", "request", "setup", "fill"]
    end_keywords: ["completed", "end", "success", "done", "finished"]

active_learning:
  enabled: true

  unknown_handling:
    enabled: true
    min_score_threshold: 20
    context_window_lines: 2
    aggregate_similar_unknown_logs: true
    storage:
      type: "jsonl+json"
      pool_file: "data/active_learning/unknown_log_pool.jsonl"
      cluster_file: "data/active_learning/unknown_log_clusters.json"

  feedback_learning:
    enabled: true
    storage:
      type: "jsonl+json"
      feedback_file: "data/active_learning/feedback_records.jsonl"
      feedback_cluster_file: "data/active_learning/feedback_clusters.json"

  suggestion_generation:
    enabled: true
    min_unknown_occurrence_for_suggestion: 3
    min_feedback_occurrence_for_suggestion: 2
    max_representative_samples_per_cluster: 3
    allow_llm_assisted_suggestions: true
    write_suggestions_to: "data/active_learning/rule_suggestions"
    review_required: true

  llm_suggestion:
    enabled: true
    force_review_only: true
    max_unknown_samples: 4
    max_feedback_samples: 4
    max_parser_snippets: 3
    max_parser_snippet_chars: 1800
    timeout_seconds: 12
    max_retries: 1
    preview_cache_ttl_seconds: 600
